<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Clicker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c5cff'/></svg>">
  <script>
    // cache-buster: forces the browser to fetch the newest CSS/JS every load
    // (skipped on file:// so the game still opens locally without a server)
    var V = location.protocol === 'file:' ? '' : '?v=' + Date.now();
    document.write('<link rel="stylesheet" href="style.css' + V + '">');
  </script>
</head>
<body>

  <header>
    <h1><span id="secret-emoji" style="cursor:default">🧩</span> Cube Clicker</h1>
    <p class="tagline">Click the puzzle. Collect them all.</p>
  </header>

  <main>
    <section class="play">
      <div class="counter">
        <span id="cube-count">0</span>
        <span class="counter-label">cubes</span>
      </div>
      <div class="rates">
        <span id="per-second">0</span>/sec
        &nbsp;•&nbsp;
        <span id="per-click">1</span>/click
        &nbsp;•&nbsp;
        ✨ <span id="shiny-count">0</span>
      </div>

      <div id="cube" class="cube" title="Click me!">
        <svg class="cube-layer show" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
        <svg class="cube-layer" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div id="puzzle-name" class="puzzle-name">3×3</div>
      <p class="hint">↑ click the puzzle to earn cubes</p>
      <div id="prestige-box" style="display:none; margin-top:12px;">
        <div id="prestige-count" class="prestige-label"></div>
        <button id="prestige-btn" class="prestige-btn">⭐ Prestige</button>
      </div>
      <button id="win-btn" class="win-btn" style="display:none;">🏆 You Win!</button>
    </section>

    <aside class="shop">
      <div id="buy-modes" class="buy-modes">
        <button data-amt="1" class="active">×1</button>
        <button data-amt="2">×2</button>
        <button data-amt="5">×5</button>
        <button data-amt="10">×10</button>
        <button data-amt="50">×50</button>
        <button data-amt="max">MAX</button>
      </div>

      <h2>Special</h2>
      <div id="shiny-up" class="card special"></div>
      <div id="auto-clicker" class="card special"></div>
      <div id="auto-rate-box" class="rate-box">
        <label for="auto-rate">Auto-click rate: <b><span id="ar-val">0</span></b> / <span id="ar-max">0</span> per sec</label>
        <input type="range" id="auto-rate" min="0" max="0" value="0">
      </div>

      <h2>Upgrades</h2>
      <div id="click-upgrade" class="card"></div>

      <h2>Boosts</h2>
      <div id="boosts"></div>

      <h2>Cube Gear</h2>
      <div id="gear"></div>

      <h2>Auto-Solvers</h2>
      <div id="buildings"></div>
    </aside>
  </main>

  <footer>
    <span id="save-status">autosaves as you play</span>
    <button id="reset-btn">Reset game</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/break_eternity.js@2.1.3/dist/break_eternity.min.js"></script>
  <script>document.write('<script src="script.js' + V + '"><\/script>');</script>
</body>
</html>
